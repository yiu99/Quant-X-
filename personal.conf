# Personal Quantumult X Configuration
# Based on official sample.conf from:
# https://github.com/crossutility/Quantumult-X
#
# Fill your node subscription in [server_remote], or add nodes manually in
# [server_local]. Keep policy names aligned with [filter_local].

[general]
profile_img_url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png
resource_parser_url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/resource-parser.js
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
fallback_udp_policy = reject
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8
udp_whitelist = 53, 123, 80-443
udp_drop_list = STUN, QUIC

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

[policy]
static = PROXY, direct
static = AUTO, direct
static = 香港节点, direct
static = 日本节点, direct
static = 台湾节点, direct
static = GLOBAL, 香港节点, PROXY, AUTO, direct
static = APPLE, direct, PROXY, AUTO
static = STREAMING, PROXY, AUTO, direct
static = TELEGRAM, PROXY, AUTO
static = AI, 日本节点, 台湾节点, PROXY, AUTO
static = REJECT, reject, direct

[server_remote]
# Replace the URL below with your real subscription URL, then remove the leading ";".
;https://example.com/your-subscription, tag=MySub, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
FILTER_LAN, tag=LAN, force-policy=direct, inserted-resource=true, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, inserted-resource=true, enabled=true

[rewrite_remote]
# Add trusted rewrite resources here only when needed.
# ;https://example.com/rewrite.snippet, tag=Rewrite, enabled=true

[server_local]
# Manual node examples. Keep them commented until you replace every field.
# ;shadowsocks=example.com:443, method=aes-128-gcm, password=password, obfs=over-tls, obfs-host=example.com, udp-relay=true, tag=Manual-SS
# ;vmess=example.com:443, method=none, password=00000000-0000-0000-0000-000000000000, obfs=wss, obfs-host=example.com, obfs-uri=/ws, udp-relay=true, tag=Manual-VMess

[filter_local]
# Local and private networks
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
ip-cidr, 100.64.0.0/10, direct

